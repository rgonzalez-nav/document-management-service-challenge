services:
  postgresql:
    container_name: postgresql_container
    image: bitnami/postgresql:15.4.0
    ports:
      - "5432:5432"
    networks:
      - batch_network
    volumes:
      - challenge_postgresql_data:/bitnami/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d
    environment:
      - POSTGRESQL_USERNAME=clara
      - POSTGRESQL_PASSWORD=clarapasswd
      - POSTGRESQL_DATABASE=challenge
      - POSTGRESQL_POSTGRES_PASSWORD=2812m4a1 # Password of user "postgres"
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # MinIO Web Console
    networks:
      - batch_network
    environment:
      MINIO_ROOT_USER: minioclara
      MINIO_ROOT_PASSWORD: minioclarapasswd
    command: server --console-address ":9001" /data
    volumes:
      - challenge_minio_data:/data
  # Include all the necessary settings to include a document management service in the stack
  # Remember to configure this service to limit the memory to 50MB
  #document-management-service:
  #    environment:
  #      - JAVA_OPTS=-Xmx50m -Xms50m
  #    deploy:
  #      resources:
  #        limits:
  #          memory: 50M
  document-management-service:
          #environment:
          #  - JAVA_OPTS=-Xmx50m -Xms50m
          #deploy:
          #  resources:
          #    limits:
          #      memory: 50M
          container_name: document-management-service
          build:
              context: ../
              dockerfile: ./docker/Dockerfile
          image: document-management-service:latest
          ports:
              - 8080:8080
          networks:
              - batch_network
          depends_on:
              - postgresql
              - minio
volumes:
  challenge_postgresql_data:
    driver: local
  challenge_minio_data:
    driver: local

networks:
  batch_network:
    driver: bridge
